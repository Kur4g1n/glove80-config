<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glove80 layout</title>
  <link rel="stylesheet" href="layout.css">
  <script src="layout-data.js"></script>
  <script src="layout.js" defer></script>
</head>
<body>
  <header class="tools">
    <nav class="layers" aria-label="Layers"></nav>
    <span class="spacer"></span>
    <button class="lang" type="button" title="English / Russian legends">EN</button>
    <button class="shift" type="button" title="Shifted legends (or hold Shift)" aria-pressed="false">⇧</button>
    <select class="flavor" title="Catppuccin flavor"></select>
    <button class="print" type="button" title="Print or save as PDF, one page per layer">PDF</button>
  </header>
  <main class="screen">
    <h1 class="title"></h1>
    <div class="page">
      <svg class="keyboard" xmlns="http://www.w3.org/2000/svg"></svg>
      <ul class="legend"></ul>
    </div>
  </main>
  <section class="printout"></section>
</body>
</html>
